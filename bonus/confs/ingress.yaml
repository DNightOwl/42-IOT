apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wil42-app-ingress
  namespace: dev
spec:
  rules:
    - http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: wil42-app
                port:
                  number: 8888
