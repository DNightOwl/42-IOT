apiVersion: apps/v1
kind: Deployment
metadata:
  name: wil42-v1
  namespace: dev
  labels:
    app: wil42-v1
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wil42-v1
  template:
    metadata:
      labels:
        app: wil42-v1
    spec:
      containers:
      - name: wil42-v1
        image: wil42/playground:v1
        ports:
        - containerPort: 8888
