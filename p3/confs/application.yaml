apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wil42-v1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DNightOwl/laafilal-IOT-config.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
          limit: 3
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 1m
